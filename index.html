<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SYNERGY Real Estate Group</title>
<style>
  :root{--sea-salt:#F8F8F8;--eerie:#252525;--tiffany:#95EEDA;--muted:#6B7278}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--sea-salt);
       color:var(--eerie);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:24px;text-align:center}
  .w{max-width:460px}
  h1{font-size:clamp(22px,5vw,30px);letter-spacing:-.02em;margin:0 0 14px;font-weight:700}
  p{color:var(--muted);line-height:1.6;font-size:15px;margin:0 0 10px}
  .r{display:inline-block;width:44px;height:3px;background:var(--tiffany);margin:0 0 22px}
  a{color:var(--eerie)}
  small{display:block;margin-top:26px;color:var(--muted);font-size:12.5px;line-height:1.55}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) body{background:var(--eerie);color:var(--sea-salt)}
    :root:not([data-theme="light"]) a{color:var(--sea-salt)}}
</style>
</head>
<body>
  <div class="w">
    <span class="r"></span>
    <h1>SYNERGY Real Estate Group</h1>
    <p>This address hosts private listing packages prepared for individual clients.</p>
    <p>Each package is reachable only by its own link. If you were sent one, use that link directly.</p>
    <small>
      SYNERGY Real Estate Group · REAL Broker Ontario Ltd., Brokerage<br>
      <a href="https://synergysold.ca">synergysold.ca</a>
    </small>
  </div>
</body>
</html>
